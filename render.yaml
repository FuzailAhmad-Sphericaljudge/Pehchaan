# Render blueprint for Pehchaan.
# One Node web service serves BOTH the built React app (dist/) and the API
# from the same origin, with a free managed PostgreSQL for persistence.
#
# Deploy: Render dashboard → New → Blueprint → pick this repo → Apply.
# Render reads this file and creates both services automatically.

services:
  - type: web
    name: pehchaan
    runtime: node
    plan: free
    region: singapore          # closest free region to India; change if you prefer
    buildCommand: npm ci && npm run build && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # NODE_ENV stays unset: the demo OTP (123456) and seeded demo logins
      # are disabled in production mode. Keep this a pilot/demo deployment.
      - key: DATABASE_URL
        fromDatabase:
          name: pehchaan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PLATFORM_ADMIN_EMAIL
        value: platform@pehchaan.org
      - key: PLATFORM_ADMIN_PASSWORD
        value: demo
      - key: ALLOW_DEMO_OTP
        value: "true"

databases:
  - name: pehchaan-db
    plan: free
    region: singapore
